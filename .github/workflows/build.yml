name: Build APKs
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build 3 APKs
        run: |
          for z in *.zip; do unzip -o "$z" -d src; done
          python3 -c 'p="src/2_koora_user_app/lib/main.dart"; s=open(p).read().replace("package:url_launcher/url_launcher.dart","package:flutter/services.dart").replace("await canLaunchUrl(deepLink)","false").replace("await launchUrl(deepLink, mode: LaunchMode.externalApplication);",""); open(p,"w").write(s)'

          flutter create --org com.kooralive --project-name koora_admin app1
          cp -r src/1_koora_admin_app/lib/* app1/lib/
          cd app1 && flutter build apk --release && cd ..
          cp app1/build/app/outputs/flutter-apk/app-release.apk Koora_1_Admin.apk

          flutter create --org com.kooralive --project-name koora_user app2
          cp -r src/2_koora_user_app/lib/* app2/lib/
          cd app2 && flutter build apk --release && cd ..
          cp app2/build/app/outputs/flutter-apk/app-release.apk Koora_2_User_Main.apk

          flutter create --org com.kooralive --project-name koora_player app3
          cp -r src/3_koora_external_player_app/lib/* app3/lib/
          cd app3 && flutter build apk --release && cd ..
          cp app3/build/app/outputs/flutter-apk/app-release.apk Koora_3_External_Player.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Koora-Live-3-APKs
          path: "*.apk"
      - name: Save APKs to Main Page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Koora_1_Admin.apk Koora_2_User_Main.apk Koora_3_External_Player.apk
          git commit -m "Add ready APKs" || true
          git push || true
          gh release create v1.0 Koora_1_Admin.apk Koora_2_User_Main.apk Koora_3_External_Player.apk --target main --title "Koora Live 3 APKs" --notes "Ready" || true
